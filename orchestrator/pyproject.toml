[project]
name = "orchestrator"
version = "0.1.0"
description = "AI 原生低代码平台 — Orchestrator 骨架"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: 慢测试（如 npm 构建、契约测试）；默认跑，按需 -m 'not slow' 跳过",
    "docker: 需要 Docker daemon 的契约测试；默认跑，无 Docker 自动 skip",
    "e2e: 真实端到端冒烟（需 LLM key + Docker），DOSKILL_E2E=1 才跑",
]
