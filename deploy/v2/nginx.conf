server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA 路由
  location / { try_files $uri $uri/ /index.html; }

  location /api/ {
    proxy_pass http://api:9000/;
    proxy_http_version 1.1;
    # SSE 必须关缓冲，否则事件被攒着不推
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Connection "";
  }
}
